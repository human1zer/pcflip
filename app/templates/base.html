<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: { DEFAULT: '{{ accent }}', hover: '{{ accent_hover }}' },
          page: '{{ bg_color }}',
          card: '{{ card_color }}',
        }
      }
    }
  }
</script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  input, select, textarea { font-size: 16px; } /* prevent iOS zoom */
</style>
</head>
<body class="bg-page text-slate-100 min-h-screen pb-24">

<header class="bg-card border-b border-slate-800 sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="font-bold text-lg tracking-tight text-accent">{{ app_name }}</a>
    <nav class="flex items-center gap-4 text-sm text-slate-300">
      <a href="/" class="hover:text-accent">Dashboard</a>
      <a href="/items" class="hover:text-accent">Items</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="hover:text-accent">Log out</button>
      </form>
    </nav>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>

<a href="/items/new" class="fixed bottom-5 right-5 bg-accent hover:opacity-90 text-slate-950 font-bold w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-accent/20">+</a>

</body>
</html>
