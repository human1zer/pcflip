{% extends "base.html" %}
{% block title %}{{ "Edit" if item else "New" }} Item - {{ app_name }}{% endblock %}
{% block content %}

<h1 class="text-xl font-semibold mb-4">{{ "Edit item" if item else "New item" }}</h1>

{% if error %}
<div class="mb-4 bg-red-950 border border-red-800 text-red-300 rounded-lg px-4 py-3 text-sm">{{ error }}</div>
{% endif %}

<form method="post" class="space-y-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <section class="bg-card border border-slate-800 rounded-xl p-4 space-y-3">
    <h2 class="font-semibold text-accent text-sm uppercase tracking-wide">Item</h2>

    <div>
      <label class="block text-sm text-slate-400 mb-1">Title *</label>
      <input required name="title" value="{{ item.title if item else '' }}" placeholder="e.g. Dell XPS 15 9570 i7/16GB/512GB"
        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Category</label>
        <select name="category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for c in categories %}
          <option value="{{ c }}" {% if item and item.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Condition</label>
        <select name="condition" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for c in conditions %}
          <option value="{{ c }}" {% if item and item.condition == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm text-slate-400 mb-1">Serial number</label>
      <input name="serial_number" value="{{ item.serial_number if item else '' }}"
        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block text-sm text-slate-400 mb-1">Status</label>
      <select name="status" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
        {% for s in statuses %}
        <option value="{{ s }}" {% if item and item.status == s %}selected{% endif %}>{{ status_labels[s] }}</option>
        {% endfor %}
      </select>
    </div>
  </section>

  <section class="bg-card border border-slate-800 rounded-xl p-4 space-y-3">
    <h2 class="font-semibold text-amber-400 text-sm uppercase tracking-wide">Purchase (from seller)</h2>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Seller name</label>
        <input name="seller_name" value="{{ item.seller_name if item else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Seller contact</label>
        <input name="seller_contact" value="{{ item.seller_contact if item else '' }}" placeholder="phone / FINN profile"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Purchase price (kr)</label>
        <input name="purchase_price" type="number" step="0.01" value="{{ item.purchase_price if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Purchase date</label>
        <input name="purchase_date" type="date" value="{{ item.purchase_date if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Payment method</label>
        <select name="purchase_method" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for m in payment_methods %}
          <option value="{{ m }}" {% if item and item.purchase_method == m %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Delivery</label>
        <select name="purchase_delivery" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for d in delivery_methods %}
          <option value="{{ d }}" {% if item and item.purchase_delivery == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Shipping company</label>
        <input name="purchase_shipping_company" value="{{ item.purchase_shipping_company if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Tracking number</label>
        <input name="purchase_tracking" value="{{ item.purchase_tracking if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>
  </section>

  <section class="bg-card border border-slate-800 rounded-xl p-4 space-y-3">
    <h2 class="font-semibold text-sky-400 text-sm uppercase tracking-wide">Sale (to buyer)</h2>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Buyer name</label>
        <input name="buyer_name" value="{{ item.buyer_name if item else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Buyer contact</label>
        <input name="buyer_contact" value="{{ item.buyer_contact if item else '' }}" placeholder="phone / FINN profile"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Sale price (kr)</label>
        <input name="sale_price" type="number" step="0.01" value="{{ item.sale_price if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Sale date</label>
        <input name="sale_date" type="date" value="{{ item.sale_date if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Payment method</label>
        <select name="sale_method" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for m in payment_methods %}
          <option value="{{ m }}" {% if item and item.sale_method == m %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Delivery</label>
        <select name="sale_delivery" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
          <option value="">-</option>
          {% for d in delivery_methods %}
          <option value="{{ d }}" {% if item and item.sale_delivery == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Shipping company</label>
        <input name="sale_shipping_company" value="{{ item.sale_shipping_company if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Tracking number</label>
        <input name="sale_tracking" value="{{ item.sale_tracking if item else '' }}"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      </div>
    </div>
  </section>

  <section class="bg-card border border-slate-800 rounded-xl p-4">
    <label class="block text-sm text-slate-400 mb-1">Notes</label>
    <textarea name="notes" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">{{ item.notes if item else '' }}</textarea>
  </section>

  <div class="flex gap-3">
    <button type="submit" class="flex-1 bg-accent hover:opacity-90 text-slate-950 font-semibold py-3 rounded-lg">
      {{ "Save changes" if item else "Add item" }}
    </button>
    <a href="{{ '/items/' ~ item.id if item and item.id else '/items' }}" class="px-4 py-3 rounded-lg border border-slate-700 text-slate-300">Cancel</a>
  </div>
</form>

{% endblock %}
